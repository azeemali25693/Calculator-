<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f3eee4">
    <title>Fast Auto-Calc Professional</title>
    <script>
        var t = 'sand'; try { t = localStorage.getItem('calcTheme') || 'sand'; } catch (e) {} if (t !== 'sand' && t !== 'dark') t = 'sand'; document.documentElement.setAttribute('data-theme', t);
    </script>
    <style>
        :root {
            /* Premium Soft Flutter / Material You Theme */
            --bg-color: #ebf0f7;
            --display-bg: transparent;
            --keypad-bg: transparent;

            --text-main: #1b2236;
            --text-muted: #8590a6;

            --btn-num-bg: #f9fafc;
            --btn-num-hover: #eef0f5;
            --btn-num-text: #1b2236;

            --btn-op-bg: #d6e7fb;
            --btn-op-hover: #c8def6;
            --btn-op-text: #1a6dca;

            --btn-eq-bg: linear-gradient(145deg, #2196f3 0%, #1565c0 100%);
            --btn-eq-hover: linear-gradient(145deg, #1e88e5 0%, #0d5bb5 100%);
            --btn-eq-text: #ffffff;

            --btn-clear-bg: #d4eee9;
            --btn-clear-hover: #c6e6e0;
            --btn-clear-text: #0f9d8a;

            --btn-op-alt: #dbe9fb;
            --btn-op-alt-hover: #cfe1f7;

            --sh-rgb: 30, 41, 90;
            --op-rgb: 25, 118, 210;
            --clr-rgb: 15, 157, 138;
            --eq-rgb: 25, 118, 210;

            --spin-track: #e3e6ee;
            --spin-arc: #b4bac8;

            --shadow-soft: none;
            --shadow-pressed: none;
        }

        /* ================= THEMES ================= */
        /* 5. Sand */
        [data-theme="sand"] {
            --bg-color: #f3eee4; --text-main: #33291c; --text-muted: #9d907a;
            --btn-num-bg: #fcfaf5; --btn-num-hover: #eee8db; --btn-num-text: #33291c;
            --btn-op-bg: #e7dcc4; --btn-op-hover: #ddd0b4; --btn-op-text: #8a6a2c;
            --btn-op-alt: #ece3cf; --btn-op-alt-hover: #e2d7be;
            --btn-eq-bg: linear-gradient(145deg, #c9a24f 0%, #8c6a1f 100%);
            --btn-eq-hover: linear-gradient(145deg, #bf9743 0%, #7d5d17 100%);
            --btn-clear-bg: #dfe8e2; --btn-clear-hover: #d0ddd4; --btn-clear-text: #4d7a63;
            --sh-rgb: 90, 70, 30; --op-rgb: 138, 106, 44; --clr-rgb: 77, 122, 99; --eq-rgb: 140, 106, 31;
            --spin-track: #e8e1d2; --spin-arc: #c4b79c;
        }
        /* 6. Black (dark mode) */
        [data-theme="dark"] {
            --bg-color: #0e1014; --text-main: #eceff4; --text-muted: #8b93a3;
            --btn-num-bg: #1c1f26; --btn-num-hover: #262a33; --btn-num-text: #eceff4;
            --btn-op-bg: #222b3a; --btn-op-hover: #2c3649; --btn-op-text: #6cb4ff;
            --btn-op-alt: #1e2634; --btn-op-alt-hover: #29334a;
            --btn-eq-bg: linear-gradient(145deg, #2196f3 0%, #1565c0 100%);
            --btn-eq-hover: linear-gradient(145deg, #1e88e5 0%, #0d5bb5 100%);
            --btn-clear-bg: #1d2e2b; --btn-clear-hover: #25403b; --btn-clear-text: #4fd1b8;
            --sh-rgb: 0, 0, 0; --op-rgb: 0, 0, 0; --clr-rgb: 0, 0, 0; --eq-rgb: 33, 150, 243;
            --spin-track: #1f232b; --spin-arc: #4a5262;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Roboto, "Google Sans", "Product Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            height: 100%;
            height: 100dvh;
            background: var(--bg-color);
            transition: background-color 0.3s ease;
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
        }

        /* Theme picker */
        .theme-btn {
            position: absolute;
            top: calc(14px + env(safe-area-inset-top));
            right: 16px;
            width: 44px; height: 44px;
            border: none; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background: var(--btn-op-bg);
            color: var(--btn-op-text);
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            z-index: 5;
            transition: transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease, color 0.3s ease;
        }
        .theme-btn:active { transform: scale(0.92); transition-duration: 0.05s; }
        .theme-panel {
            position: absolute;
            top: calc(66px + env(safe-area-inset-top));
            right: 16px;
            max-width: calc(100vw - 32px);
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
            padding: 14px 16px;
            background: var(--btn-num-bg);
            border-radius: 28px;
            box-shadow: 0 4px 24px rgba(var(--sh-rgb), 0.22), 0 1px 3px rgba(var(--sh-rgb), 0.18);
            z-index: 6;
            opacity: 0; visibility: hidden;
            transform: translateY(-8px) scale(0.96);
            transform-origin: top right;
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.2s, background-color 0.3s ease;
        }
        .theme-panel.open { opacity: 1; visibility: visible; transform: none; }
        .swatch {
            width: 38px; height: 38px;
            border: none; border-radius: 50%;
            cursor: pointer;
            box-shadow: inset 0 0 0 1.5px rgba(128, 128, 128, 0.28);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .swatch:active { transform: scale(0.88); }
        .swatch.active { box-shadow: 0 0 0 3px var(--btn-num-bg), 0 0 0 5px var(--btn-op-text); }

        /* Display Area - soft elevated card */
        .display-area {
            position: relative;
            flex: 1;
            background: var(--display-bg);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 30px 28px 28px;
            padding-top: calc(30px + env(safe-area-inset-top));
            width: 100%;
        }

        /* Expression (top) and result (bottom) swap roles, like Google Calculator:
           while typing -> BIG expression, small live result underneath
           after "="     -> small expression moves up, BIG result below        */
        .expr,
        .result {
            width: 100%;
            text-align: right;
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 0;
            white-space: nowrap;
            transform-origin: right top;
            /* Only colour is transitioned here. The size change after "=" is a
               transform animation (see playMorph) which runs on the GPU. */
            transition: color 0.25s ease;
        }

        /* Only used when text is too long even at the smallest size */
        .expr.wrap,
        .result.wrap {
            white-space: normal;
            word-break: break-all;
        }

        .expr {
            font-size: clamp(2.8rem, 13vw, 4.5rem);
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .result {
            font-size: clamp(1.5rem, 7vw, 2.1rem);
            color: var(--text-muted);
            min-height: 1.2em;
        }

        .display-area.done .expr { color: var(--text-muted); }
        .display-area.done .result { color: var(--text-main); }

        @media (prefers-reduced-motion: reduce) {
            .expr, .result { transition: none; }
        }

        /* Keypad Area */
        .keypad {
            background-color: var(--keypad-bg);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            padding: 22px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
            width: 100%;
        }

        .btn {
            border: none;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 400;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            appearance: none;
            -webkit-appearance: none;
            transition: transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease, color 0.3s ease;
            aspect-ratio: 1 / 1;
            background-color: var(--btn-num-bg);
            color: var(--btn-num-text);
            box-shadow: var(--shadow-soft);
        }

        .btn:active {
            transform: scale(0.94);
            transition-duration: 0.05s;
        }

        /* Operator Buttons */
        .operator {
            background-color: var(--btn-op-bg);
            color: var(--btn-op-text);
            font-size: 2.1rem;
            font-weight: 500;
            box-shadow: none;
        }

        /* % and divide slightly lighter blue */
        .operator[data-action="percent"],
        .operator[data-val="/"] {
            background-color: var(--btn-op-alt);
        }

        /* Action Buttons (AC, DEL) */
        .action {
            background-color: var(--btn-clear-bg);
            color: var(--btn-clear-text);
            font-size: 1.6rem;
            font-weight: 500;
            box-shadow: none;
        }

        /* Equals Button */
        .equal {
            background: var(--btn-eq-bg);
            color: var(--btn-eq-text);
            font-size: 2.3rem;
            font-weight: 500;
            border-radius: 40px;
            box-shadow: none;
        }

        .percent {
            font-size: 1.7rem;
            font-weight: 500;
        }

        .zero {
            border-radius: 50%;
        }

        /* Hover only on real pointer devices */
        @media (hover: hover) and (pointer: fine) {
            .btn:hover { background-color: var(--btn-num-hover); }
            .operator:hover { background-color: var(--btn-op-hover); }
            .operator[data-action="percent"]:hover,
            .operator[data-val="/"]:hover { background-color: var(--btn-op-alt-hover); }
            .action:hover { background-color: var(--btn-clear-hover); }
            .equal:hover { background: var(--btn-eq-hover); }
        }

        /* Native-feel touches: ink ripple, squish-and-bounce, one-time key pop-in */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: currentColor;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes pop { from { transform: scale(0.55); opacity: 0; } }
        body.ready .btn {
            animation: pop 0.34s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
            animation-delay: calc(var(--i, 0) * 12ms);
        }
        @media (prefers-reduced-motion: reduce) { body.ready .btn { animation: none; } }

        /* Loading Spinner - light gray, bold, bigger */
        .loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            opacity: 1;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 72px;
            height: 72px;
            animation: spin 0.9s linear infinite;
        }

        .spinner circle {
            fill: none;
            stroke-width: 7;
            stroke-linecap: round;
        }

        .spinner .track { stroke: var(--spin-track); }
        .spinner .arc {
            stroke: var(--spin-arc);
            stroke-dasharray: 70 200;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <noscript><style>.loader { display: none; }</style></noscript>
</head>
<body>

    <div class="loader" id="loader" role="status" aria-label="Loading">
        <svg class="spinner" viewBox="0 0 50 50">
            <circle class="track" cx="25" cy="25" r="20"></circle>
            <circle class="arc" cx="25" cy="25" r="20"></circle>
        </svg>
    </div>

    <div class="display-area" id="displayArea">
        <button class="theme-btn" id="themeBtn" aria-label="Change theme">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.8-.5-1.2-.3-.4-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-3.9-4-7.2-9-7.2z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10.5" cy="7" r="1" fill="currentColor"/><circle cx="15" cy="7.5" r="1" fill="currentColor"/></svg>
        </button>
        <div class="theme-panel" id="themePanel" role="listbox" aria-label="Themes"></div>
        <div class="expr" id="expr">0</div>
        <div class="result" id="result"></div>
    </div>

    <div class="keypad">
        <button class="btn action" data-action="clear">AC</button>
        <button class="btn operator percent" data-action="percent">%</button>
        <button class="btn operator" data-action="op" data-val="/">&divide;</button>
        <button class="btn operator" data-action="op" data-val="-">&minus;</button>

        <button class="btn" data-action="num" data-val="7">7</button>
        <button class="btn" data-action="num" data-val="8">8</button>
        <button class="btn" data-action="num" data-val="9">9</button>
        <button class="btn operator" data-action="op" data-val="*">&times;</button>

        <button class="btn" data-action="num" data-val="4">4</button>
        <button class="btn" data-action="num" data-val="5">5</button>
        <button class="btn" data-action="num" data-val="6">6</button>
        <button class="btn operator" data-action="op" data-val="+">+</button>

        <button class="btn" data-action="num" data-val="1">1</button>
        <button class="btn" data-action="num" data-val="2">2</button>
        <button class="btn" data-action="num" data-val="3">3</button>
        <button class="btn equal" data-action="eq" style="grid-row: span 2; aspect-ratio: auto;">=</button>

        <button class="btn zero" data-action="num" data-val="0">0</button>
        <button class="btn" data-action="num" data-val=".">.</button>
        <button class="btn" data-action="del" aria-label="Delete">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M13 9.5l5 5M18 9.5l-5 5"/></svg>
        </button>
    </div>

    <script>
        // Loader: spinner stays until the whole calculator has loaded
        (function () {
            const loader = document.getElementById('loader');
            const MIN_SHOW = 300;   // show spinner for at least this many ms (avoids flash)
            const MAX_WAIT = 6000;  // safety: force-hide after this many ms
            const startTime = Date.now();
            let done = false;

            function hideLoader() {
                if (done) return;
                done = true;
                const wait = Math.max(0, MIN_SHOW - (Date.now() - startTime));
                setTimeout(() => {
                    loader.classList.add('hide');
                    document.body.classList.add('ready');
                    setTimeout(() => loader.remove(), 400);
                }, wait);
            }

            const pageLoaded = new Promise(res => {
                if (document.readyState === 'complete') res();
                else window.addEventListener('load', res, { once: true });
            });
            const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

            Promise.all([pageLoaded, fontsReady]).then(hideLoader, hideLoader);
            setTimeout(hideLoader, MAX_WAIT);
        })();

        // Theme picker
        (function () {
            const THEMES = [
                { id: 'sand',     name: 'Sand',       bg: '#f3eee4', accent: '#c9a24f', meta: '#f3eee4' },
                { id: 'dark',     name: 'Black',      bg: '#0e1014', accent: '#2196f3', meta: '#0e1014' }
            ];
            const root = document.documentElement;
            const panel = document.getElementById('themePanel');
            const btn = document.getElementById('themeBtn');
            const metaTag = document.querySelector('meta[name="theme-color"]');

            function apply(id, save) {
                const t = THEMES.find(x => x.id === id) || THEMES.find(x => x.id === 'sand');
                root.setAttribute('data-theme', t.id);
                if (metaTag) metaTag.setAttribute('content', t.meta);
                panel.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.id === t.id));
                if (save) { try { localStorage.setItem('calcTheme', t.id); } catch (e) {} }
            }

            THEMES.forEach(t => {
                const b = document.createElement('button');
                b.className = 'swatch';
                b.dataset.id = t.id;
                b.setAttribute('aria-label', t.name);
                b.title = t.name;
                b.style.background = `linear-gradient(135deg, ${t.bg} 50%, ${t.accent} 50%)`;
                b.addEventListener('click', () => { apply(t.id, true); panel.classList.remove('open'); });
                panel.appendChild(b);
            });

            btn.addEventListener('click', e => { e.stopPropagation(); panel.classList.toggle('open'); });
            document.addEventListener('pointerdown', e => {
                if (!panel.contains(e.target) && !btn.contains(e.target)) panel.classList.remove('open');
            });

            let saved = null;
            try { saved = localStorage.getItem('calcTheme'); } catch (e) {}
            apply(saved || 'sand', false);
        })();

        // State variables for auto-calculation
        let num1 = '0';
        let operator = null;
        let num2 = '';
        let isFinished = false;
        let num2Pct = false; // true when % was applied to the second number
        let num2Raw = '';    // what the person typed before pressing %

        let lastExpr = '';   // the expression shown (small) above the result after pressing =

        const displayArea = document.getElementById('displayArea');
        const exprEl = document.getElementById('expr');
        const resultEl = document.getElementById('result');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Text is measured with a canvas (no layout work) so long numbers can shrink to fit
        const measureCtx = document.createElement('canvas').getContext('2d');
        let availWidth = 0;   // width of the display lines, cached (re-read only on resize)

        function refreshMetrics() {
            measureCtx.font = '400 100px ' + getComputedStyle(exprEl).fontFamily;
            availWidth = exprEl.clientWidth;
        }

        // Operator symbols as Unicode escapes (safe in any file encoding)
        const OP_SYMBOLS = {
            '*': '\u00d7', // multiplication sign
            '/': '\u00f7', // division sign
            '-': '\u2212', // minus sign
            '+': '+'
        };

        // Formats numbers with commas (e.g., 1,000,000)
        function formatNumber(numberStr) {
            if (!numberStr) return '';
            if (numberStr === 'Error') return numberStr;

            const isNegative = numberStr.startsWith('-');
            const str = isNegative ? numberStr.slice(1) : numberStr;

            const parts = str.split('.');
            const integerDigits = parseFloat(parts[0]);
            let integerDisplay = isNaN(integerDigits) ? '0' : integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });

            if (parts.length > 1) {
                return (isNegative ? '-' : '') + integerDisplay + '.' + parts[1];
            } else {
                return (isNegative ? '-' : '') + integerDisplay;
            }
        }

        // Text sizes (px) for the "big" and "small" lines, same scale as the old CSS clamp() values
        function textSizes() {
            const w = window.innerWidth;
            return {
                big: Math.min(72, Math.max(44.8, w * 0.13)),
                small: Math.min(33.6, Math.max(24, w * 0.07))
            };
        }

        // Puts text into a line and shrinks the font so it fits on one row.
        // If it still doesn't fit at minPx, it wraps onto more rows instead.
        function fitText(el, text, maxPx, minPx) {
            if (el.textContent !== text) el.textContent = text;
            const textWidthAt100 = measureCtx.measureText(text || '0').width;

            let size = maxPx;
            if (textWidthAt100 > 0 && availWidth > 0) {
                size = Math.min(maxPx, (availWidth / textWidthAt100) * 100 * 0.97);
            }
            el.classList.toggle('wrap', size < minPx);
            el.style.fontSize = Math.max(size, minPx).toFixed(1) + 'px';
        }

        // The full expression as the person typed it, e.g. 10,000+500
        function buildExpression() {
            if (operator === null) return formatNumber(num1);
            const opSymbol = OP_SYMBOLS[operator] || '+';
            if (num2 === '') return formatNumber(num1) + opSymbol;
            return formatNumber(num1) + opSymbol + (num2Pct ? formatNumber(num2Raw) + '%' : formatNumber(num2));
        }

        // Redraws are batched to once per frame, so fast tapping never piles up layout work
        let renderQueued = false;
        let hasRendered = false;   // no pop animations during the very first draw

        function updateDisplay() {
            if (renderQueued) return;
            renderQueued = true;
            requestAnimationFrame(render);
        }

        // Live calculates without needing to press Equal
        function render() {
            renderQueued = false;
            const { big, small } = textSizes();
            const done = isFinished && operator === null;
            const wasDone = displayArea.classList.contains('done');
            const prevExpr = exprEl.textContent;
            const prevResult = resultEl.textContent;
            const animate = hasRendered && !reduceMotion;

            // "First" step of the "=" morph: where both lines are right now, before the change
            const first = (animate && done && !wasDone) ? [exprEl, resultEl].map(measureLine) : null;

            displayArea.classList.toggle('done', done);

            if (done) {
                // After "=": small expression on top, BIG result below
                fitText(exprEl, lastExpr, small, 16);
                fitText(resultEl, formatNumber(num1), big, 28);
            } else {
                // While typing: BIG expression on top, small live result below
                const live = (operator && num2 !== '')
                    ? formatNumber(calculate(num1, operator, num2).toString())
                    : '';
                fitText(exprEl, buildExpression(), big, 32);
                fitText(resultEl, live, small, 16);
            }

            hasRendered = true;
            if (!animate) return;

            if (first) {
                playMorph(first);                          // typing -> after "="
            } else if (wasDone && !done) {
                popIn(exprEl, 0.9);                        // a new calculation starts after a result
            } else {
                if (exprEl.textContent !== prevExpr) popIn(exprEl, 1.04);
                if (resultEl.textContent !== prevResult) {
                    if (prevResult === '') slideIn(resultEl);   // live result appears for the first time
                    else popIn(resultEl, 1.06);
                }
            }
        }

        function measureLine(el) {
            return {
                top: el.getBoundingClientRect().top,
                size: parseFloat(getComputedStyle(el).fontSize)
            };
        }

        // All animations below only use transform / opacity, which the phone's GPU
        // handles on its own - so they stay smooth and never slow down typing.
        const EASE_OUT = 'cubic-bezier(0.2, 0.8, 0.2, 1)';
        const EASE_BOUNCE = 'cubic-bezier(0.34, 1.56, 0.64, 1)';

        // After "=": each line starts looking like it did before (old size and position)
        // and glides to its new place. The result overshoots a little and settles in.
        function playMorph(first) {
            [exprEl, resultEl].forEach((el, i) => {
                const from = first[i];
                const top = el.getBoundingClientRect().top;
                const size = parseFloat(getComputedStyle(el).fontSize);
                if (!from.size || !size) return;
                const start = `translateY(${from.top - top}px) scale(${from.size / size})`;

                if (el === resultEl) {
                    el.animate(
                        [
                            { transform: start, easing: EASE_OUT },
                            { transform: 'translateY(0) scale(1.05)', offset: 0.65, easing: 'ease-in-out' },
                            { transform: 'translateY(0) scale(1)' }
                        ],
                        { duration: 400 }
                    );
                } else {
                    el.animate(
                        [{ transform: start }, { transform: 'translateY(0) scale(1)' }],
                        { duration: 320, easing: EASE_OUT }
                    );
                }
            });
        }

        // Small bouncy pop when a line's text changes
        function popIn(el, fromScale) {
            el.animate(
                [{ transform: `scale(${fromScale})` }, { transform: 'scale(1)' }],
                { duration: 220, easing: EASE_BOUNCE }
            );
        }

        // The live result slides up and fades in the first time it shows
        function slideIn(el) {
            el.animate(
                [
                    { transform: 'translateY(10px)', opacity: 0 },
                    { transform: 'translateY(0)', opacity: 1 }
                ],
                { duration: 240, easing: EASE_OUT }
            );
        }

        function calculate(n1, op, n2) {
            const prev = parseFloat(n1);
            const current = parseFloat(n2);
            if (isNaN(prev) || isNaN(current)) return 0;

            let result;
            switch (op) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = current === 0 ? "Error" : prev / current; break;
            }
            if (result !== "Error") {
                result = Math.round((result + Number.EPSILON) * 100) / 100; // max 2 decimals
            }
            return result;
        }

        function handleNumber(num) {
            if (num1 === 'Error') handleClear();

            if (isFinished) {
                num1 = num === '.' ? '0.' : num;
                isFinished = false;
                updateDisplay();
                return;
            }

            if (operator === null) {
                if (num === '.' && num1.includes('.')) return;
                if (num1.replace(/[^0-9]/g, '').length >= 12 && num !== '.') return;
                if (num1 === '0' && num !== '.') num1 = num;
                else num1 += num;
            } else {
                if (num2Pct) { num2 = ''; num2Pct = false; }
                if (num === '.' && num2.includes('.')) return;
                if (num2.replace(/[^0-9]/g, '').length >= 12 && num !== '.') return;
                if (num2 === '0' && num !== '.') num2 = num;
                else num2 += num;
            }
            updateDisplay();
        }

        function handleOperator(op) {
            if (num1 === 'Error') handleClear();

            if (operator !== null && num2 !== '') {
                // Instantly commit the previous equation as the new base number
                num1 = calculate(num1, operator, num2).toString();
            }
            operator = op;
            num2Pct = false;
            num2 = '';
            isFinished = false;
            updateDisplay();
        }

        function handleEqual() {
            if (operator === null || num2 === '') return;
            lastExpr = buildExpression();   // remember what was calculated, e.g. 10,000+500
            num1 = calculate(num1, operator, num2).toString();
            operator = null;
            num2 = '';
            isFinished = true;
            num2Pct = false;
            updateDisplay();   // the two lines morph into their "after =" look (see playMorph)
        }

        function handleClear() {
            num2Pct = false;
            num1 = '0';
            operator = null;
            num2 = '';
            isFinished = false;
            updateDisplay();
        }

        function handlePercent() {
            if (num1 === 'Error') handleClear();
            const round = v => (Math.round(v * 1e10) / 1e10).toString();

            if (operator === null) {
                const v = parseFloat(num1);
                if (isNaN(v)) return;
                if (isFinished) lastExpr = formatNumber(num1) + '%';
                num1 = round(v / 100);
            } else if (num2 !== '') {
                const base = parseFloat(num1);
                const val = parseFloat(num2);
                if (isNaN(base) || isNaN(val)) return;
                // + and -: percent of the first number (200 + 10% = 200 + 20). * and /: simply value / 100
                if (num2Pct) return; // already a percentage
                num2Raw = num2;
                num2Pct = true;
                num2 = (operator === '+' || operator === '-') ? round(base * val / 100) : round(val / 100);
            } else {
                return;
            }
            updateDisplay();
        }

        function handleDelete() {
            if (isFinished || num1 === "Error") {
                handleClear();
                return;
            }
            if (operator === null) {
                num1 = num1.slice(0, -1);
                if (num1 === '' || num1 === '-') num1 = '0';
            } else if (num2 === '') {
                operator = null; // Removing operator
            } else {
                if (num2Pct) { num2 = num2Raw; num2Pct = false; } // first delete only removes the %
                else num2 = num2.slice(0, -1);
            }
            updateDisplay();
        }

        // Material-style ink ripple that spreads from the touch point
        function spawnRipple(btn, e) {
            if (reduceMotion || !btn.animate) return;
            const r = btn.getBoundingClientRect();
            const size = Math.hypot(r.width, r.height) * 2;
            const dot = document.createElement('span');
            dot.className = 'ripple';
            dot.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
            btn.appendChild(dot);
            dot.animate(
                [
                    { transform: 'scale(0)', opacity: 0.24 },
                    { transform: 'scale(0.6)', opacity: 0.16, offset: 0.4 },
                    { transform: 'scale(1)', opacity: 0 }
                ],
                { duration: 400, easing: 'cubic-bezier(0.2, 0, 0, 1)' }
            ).onfinish = () => dot.remove();
        }

        // Extremely fast Pointer Down events for High Hz responsiveness
        document.querySelectorAll('.btn').forEach((btn, i) => {
            btn.style.setProperty('--i', i);
            btn.addEventListener('pointerdown', (e) => {
                const action = btn.getAttribute('data-action');
                const val = btn.getAttribute('data-val');

                // Calculator logic first, so the number updates as fast as possible
                if(action === 'num') handleNumber(val);
                if(action === 'op') handleOperator(val);
                if(action === 'eq') handleEqual();
                if(action === 'clear') handleClear();
                if(action === 'del') handleDelete();
                if(action === 'percent') handlePercent();

                // Feedback effects after that
                spawnRipple(btn, e);
                // Haptic Feedback for Native Feel (Android)
                if (navigator.vibrate) navigator.vibrate(5);
            });

            // Prevent double zooming/context menu issues
            btn.addEventListener('contextmenu', e => e.preventDefault());
        });

        // Initial render + keep text sizes right on rotate/resize and once fonts are loaded
        const onMetricsChange = () => { refreshMetrics(); updateDisplay(); };
        refreshMetrics();
        updateDisplay();
        window.addEventListener('resize', onMetricsChange);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(onMetricsChange);
    </script>
</body>
</html>
